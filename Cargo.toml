[workspace]
members = ["alpenglow-greeter", "alpenglowed-comp"]
exclude = ["plugins/spotify-rust"]
resolver = "2"

[package]
name = "alpenglowed"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[features]
compositor = ["smithay"]

[dependencies]
# When using published crates instead of path:
# crepuscularity-gpui = { version = "0.5", features = ["wayland"] }
crepuscularity-core = { version = "=0.4.25" }
crepuscularity-gpui = { version = "=0.5.8", features = ["wayland"] }
crepuscularity-web = { version = "=0.4.20" }
fuzzy-matcher = "0.3"
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wayland-client = "0.31.14"

[build-dependencies]
crepuscularity-gpui = { version = "=0.5.8", features = ["wayland"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
